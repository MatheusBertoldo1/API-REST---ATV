services:
  db:
    image: postgres:15-alpine
    container_name: pg-dev-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 97956257
      POSTGRES_DB: darkhorse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=darkhorse
      - DB_USER=postgres
      - DB_PASSWORD=97956257
      - DB_DIALECT=postgres
      - DB_SSL=false
      - NODE_ENV=development
      - CI=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    depends_on:
      - db
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: pnpm dev

volumes:
  pgdata:
  backend_node_modules: